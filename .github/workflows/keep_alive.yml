name: Keep Streamlit apps awake

# URLs come from data/projects.json (+ data/site.json wake_extra_urls)
# via scripts/wake_from_data.py — do not hardcode app links here.
#
# GitHub disables scheduled workflows after ~60 days with no repo activity.
# This workflow also writes a tiny timestamp file so the schedule stays enabled.

on:
  schedule:
    # Every 6 hours (UTC). Streamlit Community Cloud can sleep between pings.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Wake apps (from data/projects.json)
        run: python scripts/wake_from_data.py

      # Resets GitHub's 60-day "inactive repo" timer so cron keeps running.
      - name: Record wake timestamp (keep schedule enabled)
        run: |
          mkdir -p .github
          date -u +"Last wake (UTC): %Y-%m-%d %H:%M:%S" > .github/last_wake.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last_wake.txt
          if git diff --staged --quiet; then
            echo "No timestamp change to commit."
          else
            git commit -m "chore: record keep-alive wake timestamp"
            git push
          fi
